name: Deploy Holiday Crowd Detector Infra

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Validate Bicep Template Syntax
      run: |
        az bicep build --file main.bicep
